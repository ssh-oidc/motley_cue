[ldf_adapter]
backend = local_unix
primary_group = users
fallback_group = users
interactive = false

[messages]
log_file = /var/log/motley_cue/feudal.log
log_level = INFO

[groups]
# The appliance deliberately fixes the primary group and restricts the groups
# that can be created. Without this, a group claim such as "sudo" could be
# turned into a real supplementary group by the local_unix backend.
policy = listed
supported_groups =
    users

[login_info]
description = motley_cue appliance
ssh_host = localhost

[backend.local_unix]
shell = /bin/bash
shell_limited = /etc/motley_cue/shells/mc-rbash
shell_restricted = /etc/motley_cue/shells/mc-message
home_base = /home
deploy_user_ssh_keys = no
## The appliance uses the base image's `users` group (GID 100) as its fixed
## primary group, which is below the default gid_min floor. Disable the floor
## and rely on the [groups] allowlist and the built-in reserved names instead.
gid_min = 0
# reserved_groups = [operators, backup-admins]
