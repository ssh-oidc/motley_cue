[mapper]
log_level = INFO
log_file = /dev/stderr

[mapper.otp]
backend = sqlite
db_location = /state/motley_cue/tokenmap.db
keyfile = /state/motley_cue/motley_cue.key

[privacy]
# Replace this before exposing the service to real users.
privacy_contact = admin@example.org
privacy_file = /etc/motley_cue/privacystatement.md

[DEFAULT]
scopes = ["openid", "profile", "email", "eduperson_entitlement"]
authorise_all = False
authorised_vos = []
vo_claim = eduperson_entitlement
vo_match = one
authorised_users = []
authorised_admins = []

# Add one [authorisation.<name>] section per OpenID Provider.
#
# [authorisation.example]
# op_url = https://op.example.org
# authorise_all = True
# audience = https://ssh.example.org
