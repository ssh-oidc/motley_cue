# oinit-switch runs as the "oinit" service account and su's to the account
# named in the SSH certificate. Non-system users (uid >= 100) are always
# permitted. Listing a system user here would allow it as a target.
#
# Keep this empty unless you explicitly need a system account such as root.
# allow-users = root

# Hard server-side denylist, checked before the rules above.
# block-users = root daemon bin sys
