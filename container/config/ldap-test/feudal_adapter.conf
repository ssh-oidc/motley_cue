# Test-only feudalAdapter configuration for container/compose/ldap-test.yml.
# The directory is disposable and binds as the read-only LDAP account created
# by the OpenLDAP container.
[ldf_adapter]
backend = ldap
fallback_group = nogroup
interactive = false

[messages]
log_file = /var/lib/motley_cue/feudal.log
log_level = INFO

[groups]
policy = listed
supported_groups =
    users

[login_info]
description = motley_cue LDAP test
ssh_host = localhost

[backend.ldap]
mode = read_only
host = ldap
port = 389
user_base = ou=users,dc=example,dc=org
group_base = ou=groups,dc=example,dc=org
admin_user = cn=readonly,dc=example,dc=org
admin_password = readonlypassword
