[ldf_adapter]
backend = ldap
fallback_group = nogroup
interactive = false

[messages]
log_file = /var/lib/motley_cue/feudal.log
log_level = INFO

[groups]
# Do not create or trust every group the OP happens to send. The LDAP backend
# in read_only mode does not modify the directory, but keeping an explicit
# allowlist is the safe default for every backend.
policy = listed
supported_groups =
    users

[login_info]
description = motley_cue API
ssh_host = ssh.example.org

[backend.ldap]
mode = read_only
host = ldap
port = 389
user_base = ou=users,dc=example,dc=org
group_base = ou=groups,dc=example,dc=org

# For pre_created or full_access mode, add the bind credentials and the
# attribute mapping here:
# admin_user = cn=admin,dc=example,dc=org
# admin_password = change-me
# attribute_oidc_uid = gecos
# attribute_local_uid = uid
# shell = /bin/bash
# home_base = /home
