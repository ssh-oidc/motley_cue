[mapper]
log_level = INFO
log_file = /dev/stderr

[mapper.otp]
backend = sqlite
db_location = /var/lib/motley_cue/tokenmap.db
keyfile = /var/lib/motley_cue/motley_cue.key

[privacy]
# Replace this before exposing the service to real users.
privacy_contact = admin@example.org
privacy_file = /etc/motley_cue/privacystatement.md

[DEFAULT]
scopes = ["openid", "profile", "email", "entitlements"]
authorise_all = False
authorised_vos = []
vo_claim = entitlements
vo_match = one
# group_claims = [entitlements, wlcg.groups]
authorised_users = []
authorised_admins = []

# Add one [authorisation.<name>] section per OpenID Provider. The API-only
# image is meant for the LDAP and bwidm backends; local_unix is refused at
# startup because the container cannot manage the SSH host's account database.
#
# [authorisation.example]
# op_url = https://op.example.org
# authorise_all = True
# audience = https://ssh.example.org
