services:
  motley-cue:
    image: sshoidc/motley-cue:${MOTLEY_CUE_TAG:-0.9.0}
    restart: unless-stopped
    environment:
      MOTLEY_CUE_CONFIG: /etc/motley_cue/motley_cue.conf
      FEUDAL_ADAPTER_CONFIG: /etc/motley_cue/feudal_adapter.conf
      FLAAT_CONFIG: /etc/motley_cue/flaat.conf
      BIND: 0.0.0.0:8080
    volumes:
      - ../config/api/motley_cue.conf:/etc/motley_cue/motley_cue.conf:ro
      - ../config/api/feudal_adapter.conf:/etc/motley_cue/feudal_adapter.conf:ro
      - ../config/api/flaat.conf:/etc/motley_cue/flaat.conf:ro
      - motley-cue-state:/var/lib/motley_cue
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # External SSH host with oinit certificate login. This image is provided by
  # the oinit repository (container/Dockerfile target "oinit-sshd"); see its
  # container/README.md for provisioning: the host key lives at
  # /state/ssh/host-key and the CA assets in /state/ssh/oinit.
  sshd:
    image: sshoidc/oinit-sshd:${OINIT_TAG:-1.4.1}
    restart: unless-stopped
    hostname: ssh
    ports:
      - "2222:22"
    volumes:
      - sshd-state:/state
      - sshd-home:/home
      # user-ca.pub and host-key-cert.pub; the certificate must match the host
      # key generated in /state/ssh.
      - ./oinit:/state/ssh/oinit:ro
      # - ./nslcd.conf:/etc/nslcd.conf:ro
    depends_on:
      - motley-cue

volumes:
  motley-cue-state:
  sshd-state:
  sshd-home:
