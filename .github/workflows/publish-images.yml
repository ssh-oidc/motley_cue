name: Publish container images

# Builds and publishes all targets of container/Dockerfile to Docker Hub:
#   api            -> sshoidc/motley-cue:<version>
#   allinone-pam   -> sshoidc/motley-cue-allinone:<version>-pam
#   allinone-oinit -> sshoidc/motley-cue-allinone:<version>-oinit
#   sshd-pam       -> sshoidc/pam-sshd:<version>
#
# Pushes to prerel publish moving `prerel[-suffix]` tags; version tags publish
# semver tags (plus `latest[-suffix]` for non-prerelease tags). On scratch
# tags every image also gets a `sha-<short>[-suffix]` tag.
#
# pam-ssh-oidc is only published for amd64 in the KIT repository, so the PAM
# targets are built for linux/amd64 only; the others are multi-arch.
#
# A release tag (v*.*.* on master) also deploys the all-in-one oinit appliance
# to the CD host (ssh-oidc-cicd.vm.fedcloud.eu). Pushes to prerel only publish
# the moving prerel tags.
#
# The external SSH host with oinit login is published by the oinit
# repository (sshoidc/oinit-sshd).

on:
  push:
    branches:
      - prerel
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: sshoidc/motley-cue
            suffix: ''
            platforms: linux/amd64,linux/arm64
          - target: allinone-pam
            image: sshoidc/motley-cue-allinone
            suffix: '-pam'
            platforms: linux/amd64
          - target: allinone-oinit
            image: sshoidc/motley-cue-allinone
            suffix: '-oinit'
            platforms: linux/amd64,linux/arm64
          - target: sshd-pam
            image: sshoidc/pam-sshd
            suffix: ''
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is on master
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest${{ matrix.suffix }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.suffix }}
            type=raw,value=prerel${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/prerel' }}
            # workflow_dispatch builds (no tag) still get a usable tag:
            type=sha,prefix=sha-,format=short,suffix=${{ matrix.suffix }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy appliance to ssh-oidc-cicd
    runs-on: ubuntu-latest
    needs: images
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') &&
      !contains(github.ref_name, '~')
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy motley-cue appliance
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "VERSION='$VERSION' flock -w 600 /tmp/webssh-oidc-deploy.lock sh -s" <<'EOF'
          set -eu
          cd /opt/webssh-oidc
          for f in docker/compose-oinit.yaml docker/compose.prod.yaml; do
            test -f "$f" || {
              echo "ERROR: /opt/webssh-oidc lacks $f; deploy a webssh-oidc release that includes it first." >&2
              exit 1
            }
          done
          git describe --exact-match --tags HEAD >/dev/null || {
            echo "ERROR: /opt/webssh-oidc is not on a release tag." >&2
            echo "       Deploy the matching webssh-oidc release first." >&2
            exit 1
          }
          if grep -q '^MC_TAG=' docker/.env; then
            sed -i "s|^MC_TAG=.*|MC_TAG=$VERSION|" docker/.env
          else
            printf 'MC_TAG=%s\n' "$VERSION" >> docker/.env
          fi
          COMPOSE='docker compose -f docker/compose-oinit.yaml -f docker/compose.prod.yaml'
          $COMPOSE pull motley-cue
          $COMPOSE up -d --wait --no-deps motley-cue
          $COMPOSE ps motley-cue
          EOF
      - name: Check motley-cue endpoint
        env:
          MC_HOST: ${{ vars.MC_HOST || 'motley-cue.ssh-oidc-cicd.vm.fedcloud.eu' }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -o /dev/null "https://$MC_HOST/"
      - name: Show remote logs on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/webssh-oidc && docker compose -f docker/compose-oinit.yaml -f docker/compose.prod.yaml logs --tail=100 motley-cue" || true
